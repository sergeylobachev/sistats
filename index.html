<!doctype html><html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
</head><body>
<table id="t" class="display" style="width:100%"></table>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
<script>
const URL="https://github.com/sergeylobachev/sistats/blob/main/sistats.csv";
Papa.parse(URL,{download:true,header:true,complete:res=>{
  const cols=Object.keys(res.data[0]||{}).map(c=>({title:c,data:c}));
  new DataTable('#t',{data:res.data,columns:cols,pageLength:25});
}});
</script>
</body></html>
