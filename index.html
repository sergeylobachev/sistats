  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
  <script>
  (function() {
    const $status = document.getElementById('status');
    const $table  = document.getElementById('t');
    const setStatus = (m, err=false) => { $status.textContent = m; $status.style.color = err ? '#ff6b6b' : ''; };

    function clean(s) { return String(s ?? '').replace(/^\uFEFF/, '').replace(/^['"]|['"]$/g,'').trim(); }
    const isNumeric = (v) => v !== null && v !== '' && !isNaN(v) && /^[-+]?\d*(?:\.\d+)?$/.test(String(v).trim());

    function initTable(parsed) {
      console.log('[Papa] meta:', parsed.meta);
      if (parsed.errors?.length) console.warn('[Papa] errors:', parsed.errors);

      const rowsRaw = Array.isArray(parsed.data) ? parsed.data : [];
      const rows = rowsRaw.filter(r => r && Object.values(r).some(v => v !== null && v !== ''));
      if (!rows.length) throw new Error('CSV распарсен, но строк данных не найдено.');

      const headers = (parsed.meta?.fields?.length ? parsed.meta.fields : Object.keys(rows[0])).map(clean);
      const rowsClean = rows.map(r => Object.fromEntries(Object.entries(r).map(([k,v]) => [clean(k), v])));

      // Build THEAD
      const thead = $table.tHead || $table.createTHead();
      while (thead.rows.length) thead.deleteRow(0);
      const htr = thead.insertRow(0);
      headers.forEach(h => { const th = document.createElement('th'); th.textContent = h; htr.appendChild(th); });

      // Init DataTable
      try { if (window.DataTable?.ext) DataTable.ext.errMode = 'throw'; } catch(_){}
      const dt = new DataTable($table, {
        data: rowsClean,
        columns: headers.map(h => ({ title: h, data: h, render: (d,t) => ((t==='sort'||t==='type') ? (isNumeric(d)?parseFloat(d):d??'') : (d??'')) })),
        pageLength: 25,
        deferRender: true,
        responsive: true,
        order: [],
      });

      // Column filters
      const tfoot = $table.tFoot || $table.createTFoot();
      while (tfoot.rows.length) tfoot.deleteRow(0);
      const ftr = tfoot.insertRow(0);
      headers.forEach((_, i) => {
        const cell = ftr.insertCell(-1);
        const input = document.createElement('input');
        input.placeholder = 'Фильтр';
        input.addEventListener('keyup', () => dt.column(i).search(input.value).draw());
        cell.appendChild(input);
      });

      setStatus('Загружено ' + rowsClean.length + ' строк • ' + headers.length + ' столбцов (inline CSV)');
    }

    function boot() {
      try {
        const csvText = document.getElementById('csvdata').textContent.replace(/^\uFEFF/, '');
        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: 'greedy',
          complete: (res) => { try { initTable(res); } catch(e) { console.error(e); setStatus('Ошибка: ' + e.message, true); } },
          error: (err) => { console.error(err); setStatus('PapaParse error', true); }
        });
      } catch(e) {
        console.error(e);
        setStatus('Критическая ошибка инициализации: ' + e.message, true);
      }
    }
    document.addEventListener('DOMContentLoaded', boot);
  })();
  </script>
